[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wegofwd-video"
version = "1.1.0"
description = "Shared video-generation seam (provider-agnostic brief/request/result, registry, provenance) for the wegofwd product family. See ADR-026."
readme = "README.md"
# 3.10 floor: kathai-chithiram (a 3.10 consumer) drives the deterministic-renderer
# path. The seam is 3.10-compatible (annotations are PEP 563 deferred); pramana
# (3.12) and wegofwd-llm (3.11) are unaffected. Lowered in v0.1.1 — the second
# consumer surfacing a real constraint, exactly as ADR-026 D7 anticipated.
requires-python = ">=3.10"
authors = [{ name = "Sivakumar Mambakkam" }]
license = { text = "Proprietary" }

# Runtime deps are deliberately minimal — the core seam (contract/registry/
# provenance/local-render) has ZERO runtime deps, so kathai's deterministic path
# pulls nothing. The Google SDK is an OPTIONAL extra; veo.py imports it lazily and
# raises VideoConfigurationError if the extra is absent.
dependencies = []

[project.optional-dependencies]
veo = ["google-genai>=0.3"]
# Self-hosted diffusion (providers/local_diffusion.py). torch is listed without a
# CUDA suffix on purpose: on a CPU-only host install it FIRST from the CPU index
# (`pip install torch --index-url https://download.pytorch.org/whl/cpu`) so this
# extra resolves against the small wheel instead of pulling 3 GB of CUDA libs.
local = [
    "torch>=2.4",
    # floors are where `dtype=` replaced `torch_dtype=` in from_pretrained; verified
    # against diffusers 0.40 / transformers 5.16 with a tiny random-weight pipeline.
    "diffusers>=0.36",
    "transformers>=4.56",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    # T5's tokenizer ships only spiece.model. transformers converts it to the
    # fast format with SentencePieceExtractor, which imports protobuf; without
    # it the conversion falls back to a tiktoken reader and dies one layer down.
    # The tiny-model integration test builds a fast tokenizer directly, so it
    # cannot catch this — only a real weight download does.
    "protobuf>=4",
    "safetensors>=0.4",
    "imageio[ffmpeg]>=2.35",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["wegofwd_video"]

# ── Ruff (mirrors wegofwd-llm so a file passes lint identically across the family) ──
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "T20", "RUF"]
ignore = [
    "E501",   # handled by formatter
    "S101",   # assert in tests
    "RUF001", # ambiguous unicode in strings (EN DASH in docstrings)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
# A verification script's job is to report to a human on stdout.
"scripts/**" = ["T20"]
# Loading a checkpoint by URL is the documented diffusers idiom, not a bandit hit.
"wegofwd_video/providers/local_diffusion.py" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["wegofwd_video"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: needs the [local] extra (torch/diffusers); auto-skipped without it",
]
